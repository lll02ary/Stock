# 台股盤後選股（網頁版）自動排程
name: 台股盤後選股

on:
  schedule:
    # 週一到週五 台北時間 17:00（GitHub 使用 UTC 時間，17:00 - 8 小時 = 09:00）
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}   # 允許手動按按鈕執行

permissions:
  contents: write

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 還原歷史行情快取
        uses: actions/cache@v4
        with:
          path: data/cache
          key: twstock-web-${{ github.run_id }}
          restore-keys: twstock-web-

      - name: 執行選股
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python main.py

      - name: 上傳報告網頁
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "盤後報告 $(TZ=Asia/Taipei date +%F)"
          git push
